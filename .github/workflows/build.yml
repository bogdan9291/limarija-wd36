name: Napravi i objavi instalaciju
on:
  push:
    branches: [main, master]
    paths: ["html/**", "src/**", "tools/**", "build/**", "package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Broj verzije (1.0.<broj pokretanja>)
        shell: bash
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm install
      - run: npm test
      - name: Napravi i objavi u Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
